<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#FAF8F1" />

  <title>Slow Glow — замечать, а не успевать</title>
  <meta name="description" content="Slow Glow — издание о том, как замечать красивое в обычном дне. Разбор твоих сохранений, красивый день, поток идей." />

  <!-- Устанавливается на «Домой» как приложение -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Slow Glow" />

  <!-- Соцсети. Когда будет домен — заменить /og.jpg на полный https-адрес -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Slow Glow" />
  <meta property="og:title" content="Slow Glow — замечать, а не успевать" />
  <meta property="og:description" content="Издание о том, как замечать красивое в обычном дне. Покажи свои сохранения — я расшифрую, кто ты." />
  <meta property="og:image" content="https://slow-glow.ru/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Slow Glow — замечать, а не успевать" />
  <meta name="twitter:description" content="Покажи свои сохранения — я расшифрую, кто ты." />
  <meta name="twitter:image" content="https://slow-glow.ru/og.jpg" />

  <link rel="icon" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Шрифты приложения -->
  <!-- Шрифты лежат локально в /fonts — никаких внешних CDN, работает без интернета до Google -->
  <link rel="preload" href="/fonts/InstrumentSerif-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/InstrumentSerif-Italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/Satoshi-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family:'Instrument Serif'; src:url('/fonts/InstrumentSerif-Regular.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:'Instrument Serif'; src:url('/fonts/InstrumentSerif-Italic.woff2') format('woff2'); font-weight:400; font-style:italic; font-display:swap; }
    @font-face { font-family:'Satoshi'; src:url('/fonts/Satoshi-Regular.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:'Satoshi'; src:url('/fonts/Satoshi-Medium.woff2') format('woff2'); font-weight:500; font-style:normal; font-display:swap; }
    @font-face { font-family:'Satoshi'; src:url('/fonts/Satoshi-Bold.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:swap; }
  </style>

  <!-- ═══════════════════════════════════════════════════════════════
       НАСТРОЙКИ. Здесь всё, что нужно менять руками.
       ═══════════════════════════════════════════════════════════════ -->
  <script>
    // Адрес ИИ-прокси. Модель по этому адресу ВИДИТ изображения —
    // от этого зависит весь разбор сохранений.
    // "/api/gigachat" — прокси к GigaChat (работает из России).
    // "/api/claude"   — прокси к Claude (нужен ключ Anthropic).
    window.SG_AI_ENDPOINT = "/api/vision";

    // Яндекс.Метрика: впиши номер счётчика вместо 0. Больше нигде ничего менять не надо.
    // Пока стоит 0 — метрика просто не включается.
    window.SG_METRIKA_ID = 110469238;
  </script>

  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; padding: 0; background: #FAF8F1; }
    body {
      font-family: 'Satoshi', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1A1A1A;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior-y: none;      /* без «резинки» при скролле на iOS */
      -webkit-tap-highlight-color: transparent;
    }
    #root { min-height: 100dvh; }

    /* Заставка на время загрузки: тот же градиентный круг, что в заставке роликов */
    #sg-boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #FAF8F1;
      transition: opacity .5s ease;
    }
    #sg-boot.hidden { opacity: 0; pointer-events: none; }
    #sg-boot .orb {
      width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(135deg, #F6E7A6, #F6B79A 65%, #F2B6C6);
      box-shadow: 0 18px 40px -20px rgba(216,190,168,.9);
      animation: sg-breathe 2.6s ease-in-out infinite;
    }
    @keyframes sg-breathe {
      0%, 100% { transform: scale(1);    opacity: .92; }
      50%      { transform: scale(1.06); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #sg-boot .orb { animation: none; }
    }
    noscript { display: block; padding: 32px; text-align: center; color: #6E6A60; }
  </style>
</head>

<body>
  <div id="sg-boot"><div class="orb"></div></div>

  <div id="root"></div>

  <noscript>Slow Glow работает с включённым JavaScript.</noscript>

  <!-- Точка входа приложения. Для Vite это /src/main.jsx -->
  <script type="module" src="/src/main.jsx"></script>

  <script>
    // Убираем заставку, когда приложение отрисовалось
    (function () {
      var boot = document.getElementById('sg-boot');
      var root = document.getElementById('root');
      var done = function () {
        if (!boot) return;
        boot.classList.add('hidden');
        setTimeout(function () { boot && boot.remove(); }, 600);
      };
      var t = setTimeout(done, 6000);   // страховка: не висеть вечно
      var check = setInterval(function () {
        if (root && root.childElementCount > 0) {
          clearInterval(check); clearTimeout(t); done();
        }
      }, 80);
    })();
  </script>

  <!-- Яндекс.Метрика. Включается сама, если выше указан номер счётчика. -->
  <script>
    (function () {
      var id = window.SG_METRIKA_ID;
      if (!id) return;   // номер не задан — метрика не грузится

      (function (m, e, t, r, i, k, a) {
        m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
        m[i].l = 1 * new Date();
        k = e.createElement(t); a = e.getElementsByTagName(t)[0];
        k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
      })(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

      ym(id, "init", { clickmap: true, trackLinks: true, accurateTrackBounce: true, webvisor: true });

      // Пиксель для браузеров без JS — подставляется сам, руками ничего вписывать не нужно
      var ns = document.createElement("noscript");
      ns.innerHTML = '<div><img src="https://mc.yandex.ru/watch/' + id +
                     '" style="position:absolute;left:-9999px" alt="" /></div>';
      document.body.appendChild(ns);
    })();
  </script>
  <script>
    // Регистрируем service worker — от него зависит установка на «Домой».
    // Он не кэширует /api, поэтому разбор всегда свежий.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function (e) {
          console.warn("SW не зарегистрировался:", e);
        });
      });
    }
  </script>
</body>
</html>
